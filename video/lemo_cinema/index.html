// ── Visual Investigation Canvas Engine ──
const W = 1920, H = 1080;

const x = cv.getContext('2d');

window.DUR = 48.0;

// Color Palette (Visual Investigation Standard)
const C = {
  bg: '#0B0C0E',
  panel: '#141619',
  panelDark: '#0D0F11',
  line: '#2E3238',
  lineDim: '#1D2024',
  text: '#ECEAE4',
  dim: '#8B9097',
  faint: '#4A4F57',
  red: '#FF4A2E',
  green: '#10B981',
  cyan: '#06B6D4',

};

const F = {
  sans: 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif',
  mono: '"Courier New", Courier, monospace'
};

// Math & Easing Helpers
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = k => 1 - Math.pow(1 - k, 3);
const lerp = (a, b, k) => a + (b - a) * k;

// Image Assets
const IM = {};
function loadImage(src) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => {
      console.warn('Failed to load image:', src);
      resolve(null);
    };
    img.src = src;
  });
}

// Subtitles mapping
const SUBS = [
  { s: 0.8, e: 6.0, who: 'TECH ECHO-7', c: C.amber, text: 'Mayday base! Hydraulic manifold ruptured at 210 bar! Nacelle pressure collapsing!' },
  { s: 8.8, e: 14.8, who: 'TECH ECHO-7', c: C.amber, text: 'Cloud RAG timed out! 504 Gateway Error! The pitch cylinder is slipping!' },
  { s: 16.2, e: 21.8, who: 'MECH-G CORE', c: C.cyan, text: 'Echo-Seven, this is MECH-G local core. Visual acquisition engaged. I have your back.' },

// ── Drawing Utilities ──
function fill(X, Y, w, h, col) {
  x.fillStyle = col;
  x.fillRect(X, Y, w, h);
}

function strokeRect(X, Y, w, h, col = C.line, lw = 1, dash = null) {
  x.save();
  x.strokeStyle = col;
  x.lineWidth = lw;
  if (dash) x.setLineDash(dash);
  x.strokeRect(X + 0.5, Y + 0.5, w - 1, h - 1);
  x.restore();
}

function hair(x0, y0, x1, y1, col = C.line, lw = 1, dash = null) {
  x.save();
  x.strokeStyle = col;
  x.lineWidth = lw;
  if (dash) x.setLineDash(dash);
  x.beginPath();
  x.moveTo(x0, y0);
  x.lineTo(x1, y1);
  x.stroke();
  x.restore();
}

function txt(s, X, Y, o = {}) {
  x.save();
  x.font = `${o.w || '400'} ${o.s || 20}px ${o.f || F.sans}`;
  x.fillStyle = o.c || C.text;
  x.textAlign = o.al || 'left';
  x.textBaseline = o.bl || 'alphabetic';
  if (o.a !== undefined) x.globalAlpha *= o.a;
  x.fillText(s, X, Y);
  const width = x.measureText(s).width;
  x.restore();
  return width;
}

function coverImage(img, X, Y, w, h, opt = {}) {
  if (!img) {
    fill(X, Y, w, h, '#000');
    return;
  }
  const iw = img.naturalWidth || img.width;
  const ih = img.naturalHeight || img.height;
  let sw = iw, sh = iw * h / w;
  if (sh > ih) {
    sh = ih;
    sw = ih * w / h;
  }
  const fx = opt.fx !== undefined ? opt.fx : 0.5;
  const fy = opt.fy !== undefined ? opt.fy : 0.5;
  const sx = (iw - sw) * fx;
  const sy = (ih - sh) * fy;

  x.save();
  if (opt.a !== undefined) x.globalAlpha *= opt.a;
  if (opt.filter) x.filter = opt.filter;
  x.drawImage(img, sx, sy, sw, sh, X, Y, w, h);
  x.restore();

  if (!opt.noBorder) strokeRect(X, Y, w, h, opt.border || C.line, 1);
}

// Forensic Source Tag
function drawTag(label, X, Y, col = C.red) {
  fill(X, Y - 12, 4, 14, col);
  txt(label, X + 10, Y, { s: 13, f: F.mono, c: C.dim, w: 'bold' });
}

// Ring Callout
function drawRing(cx, cy, r, progress, label, side = 1, col = C.red) {
  if (progress <= 0) return;
  x.save();
  x.strokeStyle = col;
  x.lineWidth = 2.5;
  x.beginPath();
  x.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * eo(progress));
  x.stroke();
  x.restore();

  if (label && progress > 0.6) {
    const a = seg(progress, 0.6, 0.85);
    const lx = cx + side * (r * 0.72);
    const ly = cy - r * 0.72;
    const ex = lx + side * 45;
    const ey = ly - 25;
    x.save();
    x.globalAlpha *= a;
    hair(lx, ly, ex, ey, col, 1.5);
    hair(ex, ey, ex + side * 20, ey, col, 1.5);
    txt(label, ex + side * 28, ey + 5, { s: 16, f: F.sans, c: col, w: '700', al: side > 0 ? 'left' : 'right' });
    x.restore();
  }
}

// Waveform display
function drawWaveform(X, Y, w, h, t, active = true, col = C.amber) {
  strokeRect(X, Y, w, h, C.lineDim, 1);
  fill(X, Y, w, h, '#0E1012');
  if (!active) {
    hair(X + 10, Y + h / 2, X + w - 10, Y + h / 2, C.lineDim, 1);
    return;
  }
  const midY = Y + h / 2;
  const bars = 48;
  const bw = (w - 20) / bars;
  x.save();
  for (let i = 0; i < bars; i++) {
    const bx = X + 10 + i * bw;
    const v = Math.abs(Math.sin((i * 0.4) + t * 14.0) * Math.cos((i * 0.15) - t * 8.0));
    const bh = Math.max(3, v * (h * 0.75));
    fill(bx, midY - bh / 2, bw - 2, bh, col);
  }
  x.restore();
}

// Subtitles renderer
function drawSubtitles(t) {
  const cur = SUBS.find(s => t >= s.s && t <= s.e);
  if (!cur) return;

  const barY = 960;
  const barH = 75;
  const barW = 1600;
  const barX = (W - barW) / 2;

  fill(barX, barY, barW, barH, 'rgba(11, 12, 14, 0.88)');
  strokeRect(barX, barY, barW, barH, C.line, 1);
  fill(barX, barY, 6, barH, cur.c);

  txt(cur.who, barX + 24, barY + 28, { s: 14, f: F.mono, c: cur.c, w: 'bold' });
  txt(cur.text, barX + 24, barY + 56, { s: 20, f: F.sans, c: C.text, w: '600' });
}

// Top Mission Clock & Incident Header

  // Timecode

  txt(tc, 60, 32, { s: 18, f: F.mono, c: C.text, w: 'bold' });

  // Location / Turbine telemetry
  drawTag('INCIDENT SITE', 380, 30, C.red);
  txt('OFFSHORE WTG-09B · NACELLE HYDRAULICS', 500, 31, { s: 14, f: F.mono, c: C.dim });

  drawTag('ALTITUDE', 900, 30, C.dim);
  txt('102m MSL', 980, 31, { s: 14, f: F.mono, c: C.dim });

  drawTag('WIND', 1140, 30, C.amber);
  txt('52 KNOTS GALE', 1200, 31, { s: 14, f: F.mono, c: C.amber });

  drawTag('STATUS', 1480, 30, t < 38.0 ? C.red : C.green);
  txt(t < 38.0 ? 'CRITICAL FAILURE' : 'SYSTEM SECURED', 1550, 31, {
    s: 14,
    f: F.mono,
    c: t < 38.0 ? C.red : C.green,
    w: 'bold'
  });
}

// ── Master Render Function ──

  }

  drawSubtitles(t);
};
